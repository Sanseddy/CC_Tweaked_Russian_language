modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
description='''${mod_description}'''

# Patches dan200.computercraft.core.util.StringUtil so typed/pasted Cyrillic characters reach the terminal
# instead of being silently dropped.
[[mixins]]
config="${mod_id}.mixins.json"

# Redirects Cyrillic glyphs to a second texture (russian_font.png) at render time. Client-only classes,
# so "required": false in the config itself - a dedicated server has nothing to apply this to.
[[mixins]]
config="${mod_id}-client.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    type="required"
    reason="This is an addon for CC: Tweaked's terminal - it has nothing to patch without it."
    versionRange="[1.120.0,)"
    ordering="AFTER"
    side="BOTH"
